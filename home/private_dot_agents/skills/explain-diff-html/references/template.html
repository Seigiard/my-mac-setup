<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- slot: title --></title>
<!-- Pico styles bare semantic HTML and follows prefers-color-scheme; see references/pico.md for its components. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
<style>
  /* Layer on top of Pico: reading width, our diagram families, diff colouring. Pico variables only, so both themes follow. */
  main.container { max-width: 52rem; }
  p, li { max-width: 44rem; }
  pre { white-space: pre; }
  pre.diff .add { display: block; background: color-mix(in srgb, var(--pico-ins-color) 18%, transparent); }
  pre.diff .del { display: block; background: color-mix(in srgb, var(--pico-del-color) 18%, transparent); }
  pre.mermaid { background: var(--pico-card-background-color); text-align: center; }
  article.stakeholder dl { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; margin: 0; }
  article.stakeholder dt { font-weight: 600; color: var(--pico-primary); }
  article.stakeholder dd { margin: 0; }
  @media (max-width: 480px) { article.stakeholder dl { grid-template-columns: 1fr; } article.stakeholder dd { margin-bottom: .5rem; } }
  figure img { display: block; max-width: 100%; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); }
  ul.checklist { list-style: none; padding-left: 0; }
  ul.checklist li { list-style: none; margin: .4rem 0; }
  ul.checklist label { font-weight: normal; }

  /* Diagram family: data flow with example data. */
  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: .5rem; margin: var(--pico-typography-spacing-vertical) 0; }
  .flow .box { flex: 1 1 9rem; min-width: 9rem; background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); padding: .5rem .7rem; font-size: .9rem; }
  .flow .box b { display: block; font-size: .75rem; color: var(--pico-muted-color); text-transform: uppercase; letter-spacing: .03em; }
  .flow .box code { display: block; margin-top: .3rem; white-space: pre-wrap; }
  .flow .arrow { align-self: center; color: var(--pico-muted-color); font-size: 1.4rem; padding: 0 .2rem; }
  @media (max-width: 480px) { .flow { flex-direction: column; } .flow .arrow { transform: rotate(90deg); text-align: center; } }

  /* Diagram family: simplified UI mock, the labelled fallback when no frame exists. */
  .ui { background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); padding: .75rem; margin: var(--pico-typography-spacing-vertical) 0; font-size: .9rem; max-width: 26rem; }
  .ui .bar { border-bottom: 1px solid var(--pico-muted-border-color); padding-bottom: .4rem; margin-bottom: .6rem; color: var(--pico-muted-color); font-size: .8rem; }
  .ui .row { display: flex; justify-content: space-between; gap: .5rem; padding: .3rem 0; border-bottom: 1px dashed var(--pico-muted-border-color); }
  .ui .row:last-child { border-bottom: 0; }
  .ui .btn { display: inline-block; border: 1px solid var(--pico-primary); color: var(--pico-primary); border-radius: 6px; padding: .1rem .5rem; }
  .ui .new { outline: 2px solid var(--pico-primary); outline-offset: 2px; border-radius: 4px; }

  @media print {
    nav.toc { display: none; }
    pre, figure, article, .flow, .ui { break-inside: avoid; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: .8em; }
  }
</style>
</head>
<body>
<main class="container">
  <hgroup>
    <h1><!-- slot: title --></h1>
    <p><!-- slot: meta (branch or PR, base, date, file count) --></p>
  </hgroup>

  <nav class="toc" aria-label="Оглавление">
    <ul>
      <li><a href="#what">Что изменилось</a></li>
      <li><a href="#background">Фон</a></li>
      <li><a href="#code">Разбор кода</a></li>
      <li><a href="#risks">Риски и на что смотреть ревьюеру</a></li>
    </ul>
  </nav>

  <h2 id="what">Что изменилось</h2>
  <article class="stakeholder">
    <header><strong>Для нетехнических читателей</strong></header>
    <dl>
      <dt>Проблема</dt><dd><!-- slot --></dd>
      <dt>Влияние</dt><dd><!-- slot --></dd>
      <dt>Что сделано</dt><dd><!-- slot --></dd>
      <dt>Что вы заметите</dt><dd><!-- slot --></dd>
    </dl>
  </article>
  <!-- slot: lead, 3 to 5 sentences -->
  <!-- slot: frames, one <figure><img src="data:image/png;base64,…" alt="…"><figcaption>…</figcaption></figure> each -->

  <h2 id="background">Фон</h2>
  <details>
    <summary>Для тех, кто впервые здесь</summary>
    <!-- slot: deep background for a newcomer -->
  </details>
  <h3>Что важно для этого изменения</h3>
  <!-- slot: narrow background with a .flow diagram carrying example data -->

  <h2 id="code">Разбор кода</h2>
  <!-- slot: grouped walkthrough; each group = one sentence of intent, then <pre class="diff">; nothing after the sketch -->

  <h2 id="risks">Риски и на что смотреть ревьюеру</h2>
  <ul class="checklist">
    <!-- slot: one <li><label><input type="checkbox"> …</label></li> per risk, each naming a file or function -->
  </ul>
</main>

<!-- Mermaid renders <pre class="mermaid"> blocks. Pico and Mermaid both load from the CDN; offline, the text and frames still read. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: true, theme: dark ? "dark" : "neutral" });
</script>
</body>
</html>
