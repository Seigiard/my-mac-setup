# Managed by chezmoi (home/private_dot_config/mise/config.toml).
# Tool versions change here, never via `mise use --global`: the alias would
# write straight to the deployed file, diverging from this source.

[tools]
node = "lts"
# Repository scripts and `make test-python` need Python 3.10 or later; the
# macOS system python3 is 3.9. mise puts this version ahead of /usr/bin.
python = "3.12"
# OpenCode 2 drops V1 plugins and shares one server across panes; stay on 1.x
# until #405 ports the local plugins and Intercom adapter.
opencode = "1.18.35"
