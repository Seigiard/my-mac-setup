# Herdr integration for kitty.
#
# Herdr is a terminal workspace manager. It runs inside kitty and owns the
# tabs, panes and workspaces. kitty is only the host window.
#
# This file is the kitty counterpart of the two marked blocks in
# ~/.config/ghostty/config ("auto-launch herdr" and "macOS-style herdr
# shortcuts"). Both terminals send the same byte sequences, so herdr needs
# no terminal-specific configuration.
#
# The hint comments below are read by the herdr command-palette plugin
# (~/.config/herdr/plugins/command-palette/palette.py). Each hint is a
# comment line built from a hash, the marker word "palette:", and three
# fields separated by vertical bars: group, key label, description.
# Do not write that marker anywhere except on a real hint line: the plugin
# matches it as plain text and would show the example as a binding.
#
#
# WHY EVERY LETTER, DIGIT AND BRACKET BINDING CARRIES --allow-fallback
#
# On a non-Latin keyboard layout (Russian, for example) the physical "T" key
# produces "е", so kitty's direct lookup for cmd+t misses and kitty falls
# back to the physical key position instead. Only bindings that opt into the
# "ascii" fallback take part in that second lookup.
#
# kitty's own defaults for letter keys are declared with
# --allow-fallback=shifted,ascii. A user binding without the flag defaults to
# "shifted" only. So on a non-Latin layout an unflagged override is dropped
# from the fallback lookup and kitty's built-in action fires instead: cmd+t
# would open a kitty tab rather than a herdr tab.
#
# Source: kitty/keys.py get_shortcut() builds the fallback candidate list and
# skips definitions whose allow_fallback does not list the fallback type;
# matching_key_actions() then keeps the last surviving definition.
#
# This is the kitty equivalent of the physical-key syntax the ghostty config
# uses for the same reason (keybind = cmd+KeyT=... plus cmd+t=unbind).
# Arrow, Tab and Enter bindings need no flag: those keys are not affected by
# the keyboard layout.

# AUTO-LAUNCH
# Start herdr in every new kitty window. herdr is not exec'd: detaching from
# herdr must drop back to a plain kitty login shell while the herdr server
# and session keep running. If herdr is not installed, the login shell
# starts directly.
# Note: kitty expands environment variables in this option, so the command
# deliberately contains no "$". The login shell (-l) supplies the Homebrew
# PATH that makes herdr reachable.
shell /bin/zsh -lc 'command -v herdr >/dev/null 2>&1 && herdr; exec /bin/zsh -l'

# GENERAL KEYS
# Ghostty needs an explicit shift+enter binding; kitty only sends the
# sequence once an application asks for the kitty keyboard protocol, so the
# binding is repeated here to keep both terminals identical.
map shift+enter send_text all \x1b[13;2u

# ctrl+v and ctrl+c in a non-Latin layout. In legacy mode kitty falls back to the
# physical key and sends \x16 in any layout (kitty/key_encoding.c
# encode_key). But when the application enables the kitty keyboard
# protocol — Claude Code does, for shift+enter — kitty instead encodes the
# layout-produced character: Russian ctrl+v becomes "CSI 1084;5u"
# (1084 = "м"), which no application recognizes as ctrl+v. send_text
# writes the literal \x16 to the pty and bypasses that encoder entirely
# (kitty/window.py send_text), so the binding works in both modes. The
# ascii fallback matches the physical V key only when the layout produces
# a codepoint above 127, so Latin layouts keep default behavior.
# Requires kitty >= 0.47.0 (--allow-fallback). The same applies to
# ctrl+c: in protocol mode the Russian layout produces "CSI 1089;5u"
# (1089 = "с") instead of \x03, so it gets the same explicit binding.
# Ghostty rebinds ctrl+c to \x03 for the same reason.
map --allow-fallback=shifted,ascii ctrl+v send_text all \x16
map --allow-fallback=shifted,ascii ctrl+c send_text all \x03

# TABS AND WORKSPACES
# Herdr's prefix is ctrl+b (\x02). Each binding below sends that prefix plus
# the herdr command key, exactly as the ghostty config does.

# palette: Tabs & workspaces | ⌘T | New tab
map --allow-fallback=shifted,ascii cmd+t send_text all \x02c
# palette: Tabs & workspaces | ⌘N | New workspace
map --allow-fallback=shifted,ascii cmd+n send_text all \x02N
# palette: Tabs & workspaces | ⌘⇧N | New worktree
map --allow-fallback=shifted,ascii cmd+shift+n send_text all \x02G
# palette: Tabs & workspaces | ⌥T | New tab
map --allow-fallback=shifted,ascii alt+t send_text all \x02c
# palette: Tabs & workspaces | ⌘⇧W | Close workspace
map --allow-fallback=shifted,ascii cmd+shift+w send_text all \x02D
map --allow-fallback=shifted,ascii cmd+k send_text all \x02W
map --allow-fallback=shifted,ascii cmd+l send_text all \x02T
map --allow-fallback=shifted,ascii cmd+shift+e send_text all \x02q

# Browser-style tab cycling via herdr defaults: prefix+n / prefix+p.
# palette: Tabs & workspaces | ⌃Tab | Next tab
map ctrl+tab send_text all \x02n
# palette: Tabs & workspaces | ⌘⇧[ / ] | Prev/next tab
map --allow-fallback=shifted,ascii cmd+shift+[ send_text all \x02p
map --allow-fallback=shifted,ascii cmd+shift+] send_text all \x02n

# Workspace switching via herdr defaults and custom prefix bindings.
# palette: Tabs & workspaces | ⌃⇧Tab | Workspace picker
map ctrl+shift+tab send_text all \x02w
# palette: Tabs & workspaces | ⌃⇧[ / ] | Prev/next workspace
map --allow-fallback=shifted,ascii ctrl+shift+[ send_text all \x02{
map --allow-fallback=shifted,ascii ctrl+shift+] send_text all \x02}

# Cmd+1..9 switches herdr tabs via herdr's default prefix+1..9.
# palette: Tabs & workspaces | ⌘1…9 | Switch tab
map --allow-fallback=shifted,ascii cmd+1 send_text all \x021
map --allow-fallback=shifted,ascii cmd+2 send_text all \x022
map --allow-fallback=shifted,ascii cmd+3 send_text all \x023
map --allow-fallback=shifted,ascii cmd+4 send_text all \x024
map --allow-fallback=shifted,ascii cmd+5 send_text all \x025
map --allow-fallback=shifted,ascii cmd+6 send_text all \x026
map --allow-fallback=shifted,ascii cmd+7 send_text all \x027
map --allow-fallback=shifted,ascii cmd+8 send_text all \x028
map --allow-fallback=shifted,ascii cmd+9 send_text all \x029

# Ctrl+shift+1..9 sends kitty-keyboard-protocol sequences for direct herdr
# workspace jumps (herdr config.toml: switch_workspace = "ctrl+shift+1..9").
# palette: Tabs & workspaces | ⌃⇧1…9 | Switch workspace
map --allow-fallback=shifted,ascii ctrl+shift+1 send_text all \x1b[49;6u
map --allow-fallback=shifted,ascii ctrl+shift+2 send_text all \x1b[50;6u
map --allow-fallback=shifted,ascii ctrl+shift+3 send_text all \x1b[51;6u
map --allow-fallback=shifted,ascii ctrl+shift+4 send_text all \x1b[52;6u
map --allow-fallback=shifted,ascii ctrl+shift+5 send_text all \x1b[53;6u
map --allow-fallback=shifted,ascii ctrl+shift+6 send_text all \x1b[54;6u
map --allow-fallback=shifted,ascii ctrl+shift+7 send_text all \x1b[55;6u
map --allow-fallback=shifted,ascii ctrl+shift+8 send_text all \x1b[56;6u
map --allow-fallback=shifted,ascii ctrl+shift+9 send_text all \x1b[57;6u

# PANES
# palette: Panes | ⌘D | Split right
map --allow-fallback=shifted,ascii cmd+d send_text all \x02v
# palette: Panes | ⌘⇧D | Split down
map --allow-fallback=shifted,ascii cmd+shift+d send_text all \x02-
# palette: Panes | ⌘⇧Enter | Zoom pane
map cmd+shift+enter send_text all \x02z
# palette: Panes | ⌘W | Close pane/tab
map --allow-fallback=shifted,ascii cmd+w send_text all \x02x
# palette: Panes | ⌘⇧P | Command palette
map --allow-fallback=shifted,ascii cmd+shift+p send_text all \x02\x20

# palette: Panes | ⇧⌥←↓↑→ | Focus pane
map shift+alt+left send_text all \x1b[1;4D
map shift+alt+down send_text all \x1b[1;4B
map shift+alt+up send_text all \x1b[1;4A
map shift+alt+right send_text all \x1b[1;4C
# palette: Panes | ⇧⌥H/J/K/L | Focus pane
map --allow-fallback=shifted,ascii shift+alt+h send_text all \x1b[1;4D
map --allow-fallback=shifted,ascii shift+alt+j send_text all \x1b[1;4B
map --allow-fallback=shifted,ascii shift+alt+k send_text all \x1b[1;4A
map --allow-fallback=shifted,ascii shift+alt+l send_text all \x1b[1;4C

# palette: Panes | ⌃⇧←↓↑→ | Move pane
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+down send_text all \x1b[1;6B
map ctrl+shift+up send_text all \x1b[1;6A
map ctrl+shift+right send_text all \x1b[1;6C
# palette: Panes | ⌃⇧H/J/K/L | Move pane
map --allow-fallback=shifted,ascii ctrl+shift+h send_text all \x1b[1;6D
map --allow-fallback=shifted,ascii ctrl+shift+j send_text all \x1b[1;6B
map --allow-fallback=shifted,ascii ctrl+shift+k send_text all \x1b[1;6A
map --allow-fallback=shifted,ascii ctrl+shift+l send_text all \x1b[1;6C
