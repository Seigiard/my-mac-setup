# kitty configuration.
#
# This file mirrors ~/.config/ghostty/config option for option, so both
# terminals behave the same. Herdr integration (auto-launch and the
# macOS-style shortcuts) lives in herdr.conf, included at the end.
#
# Reload after editing: kitty +kitten reload-config, or ctrl+shift+f5.

# FONT
# Ghostty uses the family "IosevkaTerm Nerd Font". kitty rejects that family
# because it is not strictly monospaced, and silently falls back to Menlo.
# "IosevkaTerm Nerd Font Mono" is the same typeface with the Nerd Font icon
# glyphs constrained to one cell, and it is the only Iosevka family kitty
# accepts here. Verify with:
#   kitty +runpy 'from kitty.fast_data_types import coretext_all_fonts
#   print(sorted({f["family"] for f in coretext_all_fonts(True)}))'
font_family      IosevkaTerm Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 18

# Ghostty disables ligatures with three font-feature lines (-calt, -liga,
# -dlig). kitty expresses the same intent with one option that does not
# depend on the font's PostScript name.
disable_ligatures always

# THEME
# Alabaster is the theme this setup has used since before herdr.
# Flexoki Light matches the ghostty config; swap the two include lines
# below to switch. Both files sit next to this one.
include Alabaster.conf
# include flexoki-light.conf

# CURSOR
cursor_shape block

# SHELL INTEGRATION
# Ghostty: shell-integration-features = no-cursor,sudo,title.
# kitty enables sudo and title by default, so only no-cursor is listed.
shell_integration no-cursor

# WINDOW
# inactive_text_alpha dims unfocused kitty splits, like ghostty's
# unfocused-split-opacity. Under herdr there is one kitty window, so this
# only applies when kitty is used without herdr.
inactive_text_alpha 0.7
window_padding_width 0
macos_colorspace displayp3
macos_quit_when_last_window_closed yes
remember_window_size yes

# MOUSE
# A negative mouse_hide_wait hides the pointer while typing, matching
# ghostty's mouse-hide-while-typing. kitty documents this as unreliable
# on macOS.
mouse_hide_wait -1.0
# Ghostty uses mouse-scroll-multiplier 0.5 against a default of 1.0.
# kitty's default is 5.0, so half of it is 2.5.
wheel_scroll_multiplier 2.5

# KEYBOARD
macos_option_as_alt right

# CLIPBOARD
copy_on_select clipboard
strip_trailing_spaces smart

# TERMINAL TYPE
term xterm-kitty

# HERDR
include herdr.conf
