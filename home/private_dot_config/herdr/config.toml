onboarding = false

# herdr takes its palette from the host terminal's ANSI colors instead of
# carrying a theme of its own, so the UI matches whatever kitty and ghostty
# are set to and there is no second palette to keep in sync. The
# [theme.custom] block at the end of this file overrides only the tokens
# where the native mapping fails on Flexoki Light.
[theme]
name = "terminal"

[experimental]
pane_history = true
allow_nested = true

[keys]
switch_workspace = "ctrl+shift+1..9"
new_workspace = "" # rebound below as a custom command, not dropped
new_worktree = "prefix+shift+g"
open_worktree = ["prefix+shift+o", "cmd+shift+o", "prefix+cmd+shift+o"]
remove_worktree = ["prefix+shift+y", "cmd+shift+k", "prefix+cmd+shift+k"]
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
focus_pane_left = "shift+alt+left"
focus_pane_down = "shift+alt+down"
focus_pane_up = "shift+alt+up"
focus_pane_right = "shift+alt+right"
split_horizontal = "prefix+minus"
split_vertical = "prefix+v"
close_pane = ""
swap_pane_left = "ctrl+shift+left"
swap_pane_down = "ctrl+shift+down"
swap_pane_up = "ctrl+shift+up"
swap_pane_right = "ctrl+shift+right"
resize_pane_left = "ctrl+alt+left"
resize_pane_down = "ctrl+alt+down"
resize_pane_up = "ctrl+alt+up"
resize_pane_right = "ctrl+alt+right"

# Herdr 0.9.0 can retain the source workspace's Git identity after a new
# workspace changes directories (herdrdev/herdr#3214). Start Cmd+N workspaces
# outside Git without changing the follow policy for tabs and split panes.
# Cmd+N arrives as \x02N from the terminal (see the Ghostty keybind), which
# Herdr reads as prefix+shift+n. Run `herdr server reload-config` after editing
# this pair: the unbind above and this command activate through different paths
# -- server config vs the client's custom-command manifest -- so a half-applied
# reload leaves the chord bound to nothing. Herdr logs no config events, so the
# only symptom is a key that silently stops working.
[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = '"$HERDR_BIN_PATH" workspace create --cwd "$HOME/Projects" --focus'
description = "new workspace from Projects"

[[keys.command]]
key = "cmd+shift+p"
type = "plugin_action"
command = "seigi.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "seigi.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "seigi.command-palette.smart_close"
description = "close pane, then tab, but keep workspace"

[ui]
prompt_new_tab_name = false
sidebar_min_width = 32

# Space rows read state as a shape rather than a color: x blocked, half-circle
# working, check done, ring idle, dot unknown. The default dots carry the same
# five states in five colors, which collapses on a monochrome screenshot and
# asks the eye to compare hues across a scrolling list. This setting reaches
# `state_icon` only, so it governs the Spaces rows; agent rows carry their own
# glyphs through `state_text` (see [ui.sidebar.agents]).
status_indicators = "symbols"

# Account rate limits belong on one global surface, not on every agent row:
# the figures are per-account, so five open Claude panes would repeat the same
# number five times. `tab_bar_right` is herdr's only session-wide status area.
# Herdr strips ESC sequences from `command` output, so the script carries
# urgency in the reset countdown rather than in color. The command redraws the
# countdown every minute; Claude reads a local cache, while Codex refreshes its
# backend snapshot every 15 minutes inside Herdr's command lifecycle because
# Herdr terminates any background descendants when that command exits.
tab_bar_right = [
  { type = "command", command = "~/.local/bin/herdr-agent-limits", interval_seconds = 60, timeout_seconds = 5 },
]
tab_bar_right_separator = "  |  "

# Space rows read `$branch` and `$git_status` from workspace metadata, which
# herdr-pane-labels publishes, rather than herdr's same-named built-ins. The
# built-ins render only for a repository's primary checkout: a space on a
# linked worktree leaves that row empty (herdrdev/herdr#2952, open against
# 0.8.0 and still reproducing on 0.8.2), which is every worktree space here.
# Custom tokens have no such gap, so every space shows its branch, and the
# counts read ⇣pull ⇡push ~conflicts +staged !unstaged ?untracked with empty
# positions omitted. `dim = false` keeps the branch at the contextual text
# color instead of herdr's faint, which washes out on Flexoki Light.
[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], [{ token = "$branch", dim = false }, "$git_status"]]

# Keep workspace and pane as separate built-in tokens so Herdr preserves their
# distinct styles. herdr-pane-labels assigns `<agent-prefix>:<color-animal>`
# labels, rebuilds tab labels, and publishes the Git location tokens.
# The second row pairs the alias with `$space_origin`, the space a worktree
# space was cut from, so an agent reads "platform <sep> oc:navy-loach" below
# the worktree name. A space whose label already is the repository name
# publishes no origin and the alias stands alone. The branch lives in the
# space rows above, so it is not repeated here.
# herdr dims an agent's secondary row by default; `dim = false` lifts that,
# and the explicit hexes set the reading order: workspace tx-black > origin
# base-500 > alias base-400. Inline token styles accept only strict
# #RGB/#RRGGBB (the binary rejects anything else with "sidebar token fg must
# be #RGB or #RRGGBB"), so these hexes are Light-specific like the
# [theme.custom] values below and share their fate on a dark-theme switch.
# `state_text` renders the per-state glyph each shell reports as a state label,
# again from `~/.zshrc`. The shorter `state_icon` cannot: its glyph set is
# fixed to herdr's two presets (herdrdev/herdr#3593, closed as not planned)
# and it accepts fixed styles only, no rules. The rules below therefore match
# the rendered glyph rather than the state name, and the colors rank urgency
# -- red is the only state waiting on a human, amber matches the working dot
# herdr's own presets use, and idle sits at the alias gray so a settled pane
# recedes whole. The cost of `state_text` is one ` · ` separator that
# `state_icon` does not draw.
# `$machine` is a machine glyph each shell reports for its own pane from
# `~/.zshrc`, which also owns the role-to-glyph mapping. The built-in
# `machine` token cannot carry it: it labels the *client's* endpoints, so the
# machine you are sitting at always reads "Local" with no way to rename it,
# and rows accept no literal text — only token values. A pane whose shell has
# not reported yet, or one on a machine without this dotfiles checkout, simply
# shows no glyph and the row still renders.
[ui.sidebar.agents]
# Agents are the one sidebar section where entries are read one at a time
# rather than scanned as a list, so they get the blank separator row that
# [ui.sidebar.spaces] deliberately does not.
row_gap = 1
rows = [
  [
    { token = "state_text", rules = [
      { equals = "󰀦", fg = "#AF3029", bold = true },
      { equals = "󰗠", fg = "#205EA6", bold = true },
      { equals = "󰪡", fg = "#AD8301", bold = true },
      { equals = "󰝦", fg = "#9F9D96" },
      { equals = "󰇘", fg = "#B7B5AC" },
    ] },
    "$machine",
    { token = "workspace", dim = false },
  ],
  [
    { token = "$space_origin", dim = false, fg = "#878580" },
    { token = "pane", dim = false, fg = "#9F9D96" },
  ],
]

# Native agent-status toasts are off: the pinned yankewei/herdr-focus-notify
# plugin sends its own clickable notification, and the two would otherwise
# stack for every status change.
[ui.toast]
delivery = "off" # off | herdr | terminal | system
delay_seconds = 1

# Background/structure overrides only, values from nertzy/herdr-flexoki
# flexoki-light.toml. Text tokens (overlay0, subtext0, text) stay unset on
# purpose: herdr re-dims those labels even when a theme supplies the color,
# ghostty renders that dim as a 50/50 blend with the background, and any
# theme-provided gray washes out — while the native text path honors the
# per-token `dim = false` set in the [ui.sidebar.*] rows above. Backgrounds
# get no dim, so they are safe to theme. Light-specific hexes: switching the
# terminal to a dark theme leaves these wrong — drop or swap them then.
# Full diagnosis and the role→token map: docs/solutions/design-patterns/
# herdr-terminal-theme-resolves-through-ansi-palette.md (issue #281).
[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
# ui marks the focused workspace; ui-3 distinguishes keyboard navigation —
# instead of the native ANSI-8 gray slab.
active_row_bg = "#E6E4D9"
selection_bg = "#CECDC3"
# Structural grays: surface1 is the inactive tab background; surface_dim
# draws the sidebar divider lines despite its name.
surface0 = "#E6E4D9"
surface1 = "#DAD8CE"
surface_dim = "#E6E4D9"
# Bright-text role (inactive tab labels). Renders undimmed there, so tx was
# too black and base-600 collided with the sidebar's muted text; base-400
# sits two steps lighter — distinct from both tx and the dimmed grays.
overlay1 = "#9F9D96"
