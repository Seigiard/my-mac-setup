onboarding = false

[theme]
name = "rose-pine-dawn"

[theme.custom]
panel_bg = "reset"

[experimental]
kitty_graphics = true
pane_history = true
allow_nested = true

[keys]
switch_workspace = "ctrl+shift+1..9"
new_worktree = "prefix+shift+g"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
focus_pane_left = "shift+alt+left"
focus_pane_down = "shift+alt+down"
focus_pane_up = "shift+alt+up"
focus_pane_right = "shift+alt+right"
split_horizontal = "prefix+minus"
split_vertical = "prefix+v"
close_pane = ""
swap_pane_left = "ctrl+shift+left"
swap_pane_down = "ctrl+shift+down"
swap_pane_up = "ctrl+shift+up"
swap_pane_right = "ctrl+shift+right"
resize_pane_left = "ctrl+alt+left"
resize_pane_down = "ctrl+alt+down"
resize_pane_up = "ctrl+alt+up"
resize_pane_right = "ctrl+alt+right"

[[keys.command]]
key = "cmd+shift+p"
type = "plugin_action"
command = "seigi.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "seigi.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "seigi.command-palette.smart_close"
description = "close pane, then tab, but keep workspace"

[worktrees]
directory = "~/.worktrees"

[ui]
prompt_new_tab_name = false
sidebar_min_width = 32

# Keep workspace and pane as separate built-in tokens so Herdr preserves their
# distinct styles. herdr-task-sync (~/.local/bin/herdr-task-sync) combines Git
# identity plus counts into $git_line and rebuilds tab labels from pane labels.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "pane"], ["$git_line"]]

# Native agent-status toasts are off: the herdr-focus-notify plugin sends its
# own clickable notification (with `herdr agent focus` on click), and the two
# would otherwise stack for every status change.
[ui.toast]
delivery = "off"   # off | herdr | terminal | system
delay_seconds = 1
