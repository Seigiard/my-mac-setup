onboarding = false

[theme]
name = "rose-pine-dawn"

[theme.custom]
panel_bg = "reset"

[experimental]
kitty_graphics = true

[keys]
switch_workspace = "ctrl+shift+1..9"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
focus_pane_left = "shift+alt+left"
focus_pane_down = "shift+alt+down"
focus_pane_up = "shift+alt+up"
focus_pane_right = "shift+alt+right"
split_horizontal = "prefix+minus"
split_vertical = "prefix+v"
close_pane = ""
swap_pane_left = "ctrl+shift+left"
swap_pane_down = "ctrl+shift+down"
swap_pane_up = "ctrl+shift+up"
swap_pane_right = "ctrl+shift+right"

[[keys.command]]
key = "cmd+shift+p"
type = "plugin_action"
command = "seigi.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "seigi.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "seigi.command-palette.smart_close"
description = "close pane, then tab, but keep workspace"

[ui]
prompt_new_tab_name = false
sidebar_min_width = 22

# The `pane` row renders the pane label, which herdr-task-sync
# (~/.local/bin/herdr-task-sync) sets to `<agent-prefix>:<task-slug>`. The same
# script rebuilds each tab label from the labels of its panes, so the agent and
# the task appear once per pane instead of once per row. Herdr 0.8 collapses a
# custom-token row when its token is empty, so worktree and stale status remain
# separate without leaving blank rows for fresh Git or non-Git panes.
[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["pane"], ["$worktree"], ["$location_status"]]

[ui.toast]
delivery = "system"   # off | herdr | terminal | system
delay_seconds = 1
