id = "seigi.pane-labels"
name = "Pane Labels"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Keep pane and tab labels in step with what each pane runs."
platforms = ["macos", "linux"]

# ~/.local/bin/herdr-task-sync remains the only pane and tab label writer.
# Events only invalidate its session-wide presentation coordinator, while the
# daemon repairs foreground process and CWD changes that emit no useful event.

# Starts the daemon with the herdr server.
[[startup]]
command = ["sh", "ensure.sh"]

# Herdr 0.8 lifecycle events are invalidation signals, not state payloads.
[[events]]
on = "pane.created"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "pane.moved"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "pane.exited"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "pane.closed"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "tab.created"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "tab.closed"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "tab.moved"
command = ["sh", "ensure.sh", "--event"]

[[events]]
on = "tab.renamed"
command = ["sh", "ensure.sh", "--event"]
