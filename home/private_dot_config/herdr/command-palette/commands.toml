[[commands]]
group = "Git"
title = "Lazygit in new tab"
description = "Open a new tab in the current pane's directory and run lazygit"
type = "tab_run"
label = "lazygit"
command = "lazygit"

[[commands]]
group = "Git"
title = "Lazygit in popup"
# The Cyrillic entries are `lg` and `lazy` typed on the ЙЦУКЕН layout: the
# palette opens in whatever layout you were already typing in, and the shortcut
# list is literal text, so nothing in the palette has to know about layouts.
shortcuts = ["lg", "дп", "дфян"]
description = "Open lazygit in a 90%×90% popup in the current pane's directory"
type = "shell"
pause = false
command = "nohup bash -c \"sleep 0.4; herdr plugin pane open --plugin seigi.command-palette --entrypoint lazygit --width 90% --height 90% --cwd {target_cwd_q} --focus\" >/dev/null 2>&1 &"

[[commands]]
group = "Git"
title = "Switch to the latest main"
description = "Switch to the latest main branch, pull changes and update"
type = "shell"
command = "zsh -ic 'git checkout main && gpmain && check-deps'"

[[commands]]
group = "Git"
title = "Merge main branch"
description = "Run gmmain in the current pane's directory"
type = "shell"
command = "zsh -ic 'gmmain && check-deps'"

[[commands]]
group = "Git"
title = "Update main branch"
description = "Run gpmain in the current pane's directory"
type = "shell"
command = "zsh -ic 'gpmain'"

[[commands]]
group = "Workspaces"
title = "Switch workspace"
shortcuts = ["ws", "цы"]
description = "Choose and focus a workspace"
type = "workspace_picker"

# herdr refuses `worktree create` and `worktree open` when the source is a
# linked worktree: "New and open worktree actions start from the repo parent
# workspace." {target_cwd} is whatever pane the palette was opened from, and
# that is usually a worktree -- the case where you most want these commands.
# So resolve the primary checkout first. `git worktree list --porcelain` names
# it on the first line, the same rule the worktree-setup plugin uses.
[[commands]]
group = "Worktrees"
title = "New worktree"
description = "Create and focus a worktree from the current repository"
type = "form"
run_type = "shell"
pause = false
command = "root=$(git -C {target_cwd_q} worktree list --porcelain | head -n 1 | cut -d ' ' -f 2-); if [ -z \"$root\" ]; then printf '%s\\n' 'Not inside a Git repository.' >&2; exit 1; fi; exec \"$HERDR_BIN_PATH\" worktree create --cwd \"$root\" --branch {value_q} --focus"
prompt = "Branch name for the new worktree"
placeholder = "worktree/my-feature"

[[commands]]
group = "Worktrees"
title = "Open worktree"
description = "Choose and focus an existing worktree"
type = "select"
options_command = "git -C {target_cwd_q} worktree list --porcelain | awk '/^worktree / { path = substr($0, 10) } index($0, \"branch refs/heads/\") == 1 { branch = substr($0, 19); printf \"%s\\t%s\\t%s\\n\", branch, branch, path }'"
run_type = "shell"
pause = false
command = "root=$(git -C {target_cwd_q} worktree list --porcelain | head -n 1 | cut -d ' ' -f 2-); if [ -z \"$root\" ]; then printf '%s\\n' 'Not inside a Git repository.' >&2; exit 1; fi; exec \"$HERDR_BIN_PATH\" worktree open --cwd \"$root\" --branch {value_q} --focus"

[[commands]]
group = "Worktrees"
title = "Delete worktree checkout"
description = "Remove the current worktree checkout and keep its branch"
type = "form"
append_value = false
command = "if [ \"$HERDR_COMMAND_PALETTE_VALUE\" = DELETE ]; then \"$HERDR_BIN_PATH\" worktree remove --workspace \"$HERDR_WORKSPACE_ID\"; else printf '%s\\n' 'Worktree checkout not deleted: type DELETE to confirm.' >&2; exit 1; fi"
prompt = "Type DELETE to remove this worktree checkout"
placeholder = "DELETE"

[[commands]]
group = "Editor"
title = "Open in Zed"
shortcuts = ["zed", "яув"]
description = "Open the current pane's directory in Zed"
type = "shell"
pause = false
command = "python3 {plugin_root_q}/open_in_zed.py {target_cwd_q}"

[[commands]]
group = "Herdr"
title = "Reload config"
description = "Apply config.toml changes without restarting panes"
type = "herdr"
args = ["server", "reload-config"]

[[commands]]
group = "Settings"
title = "Edit command palette config"
shortcuts = ["edit", "увше"]
description = "Open commands.toml in a new tab with $EDITOR"
# tab_run, not pane_run: the palette refuses to type into a pane an agent owns,
# and most panes here have one. A new tab always has room for the editor.
type = "tab_run"
label = "commands.toml"
command = "${EDITOR:-vi} {config_file_q}"
