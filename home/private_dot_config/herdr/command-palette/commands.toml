[[commands]]
group = "Git"
title = "Lazygit in new tab"
description = "Open a new tab in the current pane's directory and run lazygit"
type = "tab_run"
label = "lazygit"
command = "lazygit"

[[commands]]
group = "Git"
title = "Lazygit in popup"
# The Cyrillic entries are `lg` and `lazy` typed on the ЙЦУКЕН layout: the
# palette opens in whatever layout you were already typing in, and the shortcut
# list is literal text, so nothing in the palette has to know about layouts.
shortcuts = ["lg", "дп", "дфян"]
description = "Open lazygit in a 90%×90% popup in the current pane's directory"
type = "shell"
pause = false
command = "nohup bash -c \"sleep 0.4; herdr plugin pane open --plugin seigi.command-palette --entrypoint lazygit --width 90% --height 90% --cwd {target_cwd_q} --focus\" >/dev/null 2>&1 &"

[[commands]]
group = "Git"
title = "Switch to the latest main"
description = "Switch to the latest main branch, pull changes and update"
type = "shell"
command = "zsh -ic 'git checkout main && gpmain && check-deps'"

[[commands]]
group = "Git"
title = "Merge main branch"
description = "Run gmmain in the current pane's directory"
type = "shell"
command = "zsh -ic 'gmmain && check-deps'"

[[commands]]
group = "Git"
title = "Update main branch"
description = "Run gpmain in the current pane's directory"
type = "shell"
command = "zsh -ic 'gpmain'"

[[commands]]
group = "Editor"
title = "Open in Zed"
shortcuts = ["zed", "яув"]
description = "Open the current pane's directory in Zed"
type = "shell"
pause = false
command = "zed {target_cwd_q}"

[[commands]]
group = "Herdr"
title = "Switch workspace"
shortcuts = ["ws", "цы"]
description = "Choose and focus a workspace"
type = "workspace_picker"

[[commands]]
group = "Smithers"
title = "sm monitor"
description = "Open the smithers live web UI (Gateway :7331) in the browser"
type = "shell"
pause = false
command = "se monitor"

[[commands]]
group = "Herdr"
title = "Reload config"
description = "Apply config.toml changes without restarting panes"
type = "herdr"
args = ["server", "reload-config"]

[[commands]]
group = "Settings"
title = "Edit command palette config"
shortcuts = ["edit", "увше"]
description = "Open commands.toml in a new tab with $EDITOR"
# tab_run, not pane_run: the palette refuses to type into a pane an agent owns,
# and most panes here have one. A new tab always has room for the editor.
type = "tab_run"
label = "commands.toml"
command = "${EDITOR:-vi} {config_file_q}"
