<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Render kit, see ~/.claude/shared/render-kit.md: Pico styles bare semantic HTML, speed-highlight colours shj-lang-* blocks, both follow prefers-color-scheme. assemble.py places this at the kit head marker. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@speed-highlight/core@2.1.0/dist/themes/github-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@speed-highlight/core@2.1.0/dist/themes/github-dark.css" media="(prefers-color-scheme: dark)">
<style>
  /* Stated on body, not inherited from html: a host page (Claude Artifacts) resets body to its own 14px font and colours. */
  body { font-size: 1rem; line-height: var(--pico-line-height); font-family: var(--pico-font-family); background: var(--pico-background-color); color: var(--pico-color); }
  /* Type from modernfontstacks.com: installed system fonts only, so nothing downloads and an Artifact renders the same offline. Text is Neo-Grotesque, page and section titles Old Style, lower headings Industrial, code Monospace Code. Each stack falls through to fonts with Cyrillic. */
  :root {
    --pico-font-family-sans-serif: Inter, Roboto, 'Helvetica Neue', 'Arial Nova', 'Nimbus Sans', Arial, sans-serif, var(--pico-font-family-emoji);
    --pico-font-family-monospace: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace, var(--pico-font-family-emoji);
  }
  :is(h3, h4, h5, h6) { font-family: Bahnschrift, 'DIN Alternate', 'Franklin Gothic Medium', 'Nimbus Sans Narrow', sans-serif-condensed, sans-serif; }
  :is(h1, h2) { font-family: 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L', P052, serif; font-weight: 700; }
  /* Figures line up in columns wherever values are compared. */
  table, dl.rows, .ui { font-variant-numeric: tabular-nums; }
  /* Pico drops the container's side padding above 576px; a reading page keeps a gutter at every width. */
  main.container { max-width: 52rem; padding-inline: var(--pico-spacing); }
  /* Prose keeps a reading measure of about 80 characters; code, frames, tables and diagrams use the full column. */
  /* A path, URL or hash has no space to break at and would push the page wider than a phone; it breaks anywhere instead. Table cells keep whole words, so a wide table scrolls in its overflow-auto wrapper rather than crushing its columns letter by letter. */
  main { overflow-wrap: anywhere; }
  main :is(th, td) { overflow-wrap: normal; }
  p, li { max-width: 44rem; }
  /* Code blocks take Pico's code colours and font instead of the highlighter theme's own box. */
  [class*="shj-lang-"] { background: var(--pico-code-background-color); color: var(--pico-code-color); border: 0; border-radius: var(--pico-border-radius); padding: var(--pico-spacing); margin: var(--pico-typography-spacing-vertical) 0; font: .875em/1.6 var(--pico-font-family-monospace); }
</style>
