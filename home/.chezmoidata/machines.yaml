# One entry per machine role. A role carries the whole machine identity:
# its OS, its SSH endpoints and keys, and its age recipient.
#
# age_recipient is the public half of the role's Machine identity. It is
# present only on enrolled laptops; chezmoi encrypts the secrets file for
# every recipient listed here, so adding or removing one is an enrollment or
# a revocation and requires re-encrypting the secrets file afterwards
# (docs/machine-secrets.md). The server has no recipient on purpose: it
# receives no secrets.
#
# identity_file is the private SSH key the role uses for outbound access. It
# is generated or placed on the machine by hand and never committed; chezmoi
# manages only the public keys and authorized_keys.
machines:
  roles:
    mbp2026:
      os: darwin
      aliases:
        - mbp2026
        - mbp2026.local
      hostname: mbp2026.tailc9825c.ts.net
      user: andrew.b
      identity_file: ~/.ssh/mbp2026
      age_recipient: age1fnnphxjnvdmc609np5v56v5jva9jpl8nclyv9hhwp454y94283uqxzk4qf
      authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINUI/t06lbPQ/ieRE5sLlAVO6oUfdHwKvwNaH/irZ2w2 SSH mbp2021
    mbp2021:
      os: darwin
      aliases:
        - mbp2021
        - mbp2021.local
      hostname: mbp2021.tailc9825c.ts.net
      user: seigiard
      identity_file: ~/.ssh/mbp2021
      age_recipient: age1mm9lq9varrdzgrz6lu8acj2smljjnyap76agv4l59yhjnjdcyptq5kngrr
      authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDW5HyTbWdDE/Be0hHX2XgGOvNuEZyOOQBWu2VDzdrsC SSH mbp2026
    server:
      os: linux
      aliases:
        - server
        - home.local
      hostname: home.tailc9825c.ts.net
      user: seigiard
      authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDW5HyTbWdDE/Be0hHX2XgGOvNuEZyOOQBWu2VDzdrsC SSH mbp2026
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINUI/t06lbPQ/ieRE5sLlAVO6oUfdHwKvwNaH/irZ2w2 SSH mbp2021
