# ce-optimize spec — reduce wall-clock time of the complete production test suite.
# Run authorized to proceed autonomously by the invoking arguments
# ("Do not ask the user questions"); user gates are satisfied by that standing
# approval and recorded in the experiment log.

name: test-suite-time
description: >
  Reduce the wall-clock time of the complete production test suite (make
  test-ubuntu: test-issues + docker build + full in-container apply/suite;
  plus the host-safe macOS suite make test-suite) as much as safely
  possible, preserving every test, assertion, pass/fail/skip behavior with
  reasons, diagnostics, filesystem effects, platform behavior, process
  cleanup, and deterministic isolated execution.

metric:
  primary:
    type: hard
    name: full_suite_wall_seconds
    direction: minimize
    # no numeric target: goal is "as much as safely possible"; stop on
    # plateau or backlog exhaustion
  objectives:
    - name: full_suite_wall_seconds
      direction: minimize
      role: required
    - name: host_suite_wall_seconds
      direction: minimize
      role: required
      # host suite must at least not regress; small absolute jitter allowed
      max_regression: { type: relative, value: 0.10 }
  degenerate_gates:
    - name: suite_passed
      check: "== 1"
      description: All four production commands exit 0
    - name: docker_fail_count
      check: "== 0"
      description: No bats failures in the Docker full suite
    - name: host_fail_count
      check: "== 0"
      description: No bats failures in the host-safe suite
    # Count gates finalized from the probe run (20260828T055940):
    - name: docker_test_count
      check: "== 428"
      description: Every Docker-suite test still runs (28 templates + 400 post-apply)
    - name: host_test_count
      check: "== 387"
      description: Every host-safe-suite test still runs
    - name: docker_skip_count
      check: "== 11"
      description: Docker skip count unchanged (set parity additionally line-diffed)
    - name: host_skip_count
      check: "== 3"
      description: Host skip count unchanged (set parity additionally line-diffed)
    # Skip-SET parity (lines with reasons, per docs/solutions/design-patterns/
    # skip-set-parity-proves-reduced-dependencies.md) is checked on every keep
    # decision by diffing extract-outcomes.sh output against
    # baseline-outcomes-{docker,host}.txt — stronger than the count gates.
  diagnostics:
    - name: test_issues_seconds
    - name: docker_build_seconds
    - name: docker_suite_seconds
    - name: docker_test_count
    - name: docker_skip_count
    - name: host_test_count
    - name: host_skip_count

measurement:
  command: "bash .context/compound-engineering/ce-optimize/test-suite-time/measure-suite.sh"
  timeout_seconds: 3600
  working_directory: "."
  stability:
    mode: ladder
    repeat_count: 3
    aggregation: median
    comparison:
      method: relative
      relative_threshold: 0.05
    ladder:
      smoke_command: "make test-issues"
      exploratory_pairs: 1
      confirmation_repeats: 3
      futility:
        worse_factor: 1.15

scope:
  mutable:
    - "Makefile"
    - "docker/"
    - "tests/"
    - "scripts/"
    - "home/"
    - ".github/workflows/"
  immutable:
    - ".context/compound-engineering/ce-optimize/test-suite-time/measure-suite.sh"
    - "docs/solutions/"
    - "docs/issues/"

execution:
  mode: serial          # shared Docker daemon + timing needs an unloaded host
  backend: worktree     # run lives in the dedicated session worktree;
  max_concurrent: 1     # experiments applied in-place, kept or reverted by git

parallel:
  port_strategy: none
  shared_files: []
  exclusive_resources: ["docker-daemon", "host-timing"]

dependencies:
  approved: []

constraints:
  - "Do not delete, weaken, merge away, or skip tests to improve timing"
  - "Preserve skip sets WITH reasons (line-diff parity), not just counts"
  - "Do not touch: tests/idempotent.bats MMS_DISPOSABLE_HOME guard, the one-test nested-bats probe (tests/scripts.bats), the 30s watchdog alignment static test, CI timeout-minutes ceilings"
  - "scripts.bats has elapsed-seconds assertions calibrated for --jobs 8; any parallelism change must re-check them under the new profile"
  - "Never run chezmoi apply on the host; never chezmoi init without the test config outside Docker"
  - "Measure with stdin from /dev/null (non-TTY), machine otherwise as-is"
  - "Canonical make targets remain the gates; restructure inside the Makefile, do not bypass it"

stopping:
  max_iterations: 12
  max_hours: 6
  plateau_iterations: 4
  target_reached: true

max_runner_up_merges_per_batch: 0
