name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CHEZMOI_NAME: "Test User"
  CHEZMOI_EMAIL: "test@example.com"
  # Runners lack node's release GPG key, so mise's signature check on
  # `node@lts` fails. Skip it in CI; local installs keep verification.
  MISE_NODE_VERIFY: "false"
  # `brew cleanup` runs after every formula and deletes stale downloads from a
  # cache that parallel installs are still writing. When it loses that race it
  # exits non-zero, which `brew bundle` counts as a failed dependency and the
  # whole apply fails on a formula that actually installed. The Docker runner
  # already disables it (docker/Dockerfile.ubuntu); the workflow now matches.
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin

      - name: Add chezmoi to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # The command palette shells out to `fzf --filter` and refuses to start
      # without it. Ubuntu's apt fzf predates --accept-nth, which the palette
      # uses to map a match back to its command, so install the upstream build.
      - name: Install fzf
        run: |
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin fzf
          fzf --version
        env:
          FZF_VERSION: "0.74.3"

      # Must precede the apply: run_onchange_after_4-install-smithers-deps.sh
      # provisions ~/.claude/.smithers only when bun is on PATH, and exits 0
      # without a word when it is not. The Brewfile does install bun, but into
      # Linuxbrew's prefix, which this job never puts on PATH — so the apply
      # silently leaves the runtime without node_modules and the `se flow`
      # tests then run bun in a directory that has none. macOS never hits this
      # because brew's prefix is on PATH there by default.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # Stage 1: Initialize chezmoi (non-interactive via env vars)
      - name: Initialize chezmoi
        run: chezmoi init --source=./home

      # Stage 2: Validate test infrastructure
      - name: Validate test infrastructure
        run: bats tests/helpers_test.bats

      # Stage 3: Fast pre-check gate (no apply needed)
      - name: Run template tests (pre-apply gate)
        run: bats tests/templates.bats

      # Stage 4: Apply dotfiles
      - name: Apply dotfiles (dry-run first)
        run: chezmoi diff --source=./home || true

      - name: Apply dotfiles
        run: chezmoi apply --source=./home --verbose

      # The other smithers directory. Tests that set SE_SMITHERS_DIR point `se`
      # at the checkout instead of the deployed runtime, and nothing provisions
      # that copy — the apply deploys from it, it does not build it.
      - name: Install smithers dependencies in the source tree
        working-directory: home/private_dot_claude/dot_smithers
        run: bun install --frozen-lockfile

      # Report each gap once, here, instead of once per dependent test.
      - name: Verify both smithers directories the tests call
        run: |
          test -x home/private_dot_claude/dot_smithers/node_modules/.bin/smithers
          test -x "$HOME/.claude/.smithers/node_modules/.bin/smithers"

      # Stage 5: Post-apply tests
      - name: Run post-apply tests
        run: bats tests/smoke.bats tests/scripts.bats tests/palette.bats tests/platform.bats tests/idempotent.bats

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Install bats
        run: brew install bats-core

      # See the ubuntu job: fzf is the command palette's scorer, not optional.
      - name: Install fzf
        run: brew install fzf

      - name: Initialize chezmoi
        run: chezmoi init --source=./home

      - name: Validate test infrastructure
        run: bats tests/helpers_test.bats

      - name: Run template tests (pre-apply gate)
        run: bats tests/templates.bats

      - name: Apply dotfiles (dry-run first)
        run: chezmoi diff --source=./home || true

      - name: Apply dotfiles
        run: chezmoi apply --source=./home --verbose

      # See the ubuntu job. The deployed runtime needs no step here: brew's
      # prefix is on PATH, so the apply's own script already provisioned it.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install smithers dependencies in the source tree
        working-directory: home/private_dot_claude/dot_smithers
        run: bun install --frozen-lockfile

      - name: Verify both smithers directories the tests call
        run: |
          test -x home/private_dot_claude/dot_smithers/node_modules/.bin/smithers
          test -x "$HOME/.claude/.smithers/node_modules/.bin/smithers"

      - name: Run post-apply tests
        run: bats tests/smoke.bats tests/scripts.bats tests/palette.bats tests/platform.bats tests/idempotent.bats

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: make lint
