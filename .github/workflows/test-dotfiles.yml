name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CHEZMOI_NAME: "Test User"
  CHEZMOI_EMAIL: "test@example.com"
  # Runners lack node's release GPG key, so mise's signature check on
  # `node@lts` fails. Skip it in CI; local installs keep verification.
  MISE_NODE_VERIFY: "false"
  # `brew cleanup` runs after every formula and deletes stale downloads from a
  # cache that parallel installs are still writing. When it loses that race it
  # exits non-zero, which `brew bundle` counts as a failed dependency and the
  # whole apply fails on a formula that actually installed. The Docker runner
  # already disables it (docker/Dockerfile.ubuntu); the workflow now matches.
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin

      - name: Add chezmoi to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # The command palette shells out to `fzf --filter` and refuses to start
      # without it. Ubuntu's apt fzf predates --accept-nth, which the palette
      # uses to map a match back to its command, so install the upstream build.
      - name: Install fzf
        run: |
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin fzf
          fzf --version
        env:
          FZF_VERSION: "0.74.3"

      # Stage 1: Initialize chezmoi (non-interactive via env vars)
      - name: Initialize chezmoi
        run: chezmoi init --source=./home

      # Stage 2: Validate test infrastructure
      - name: Validate test infrastructure
        run: bats tests/helpers_test.bats

      # Stage 3: Fast pre-check gate (no apply needed)
      - name: Run template tests (pre-apply gate)
        run: bats tests/templates.bats

      # Stage 4: Apply dotfiles
      - name: Apply dotfiles (dry-run first)
        run: chezmoi diff --source=./home || true

      - name: Apply dotfiles
        run: chezmoi apply --source=./home --verbose

      # `chezmoi apply` provisions the deployed runtime at ~/.claude/.smithers,
      # but tests/scripts.bats runs `se` straight from the checkout, whose
      # SMITHERS_DIR is the adjacent home/private_dot_claude/dot_smithers.
      # Without node_modules there, six `se` tests fail on the missing
      # dependency instead of on the behavior they assert.
      #
      # The Brewfile does install bun, but into Linuxbrew's prefix, which this
      # job never puts on PATH; setup-bun keeps that independent of the apply
      # rather than exposing every brewed binary to the test step.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # --backend=copyfile: with bun's default backend this runner links
      # packages out of ~/.bun/install/cache, and a package that runs from
      # there resolves its imports against the cache rather than node_modules,
      # so `se flow` dies on "Cannot find module 'effect/Effect'". Copying
      # gives the same tree a fresh install produces on macOS, where the five
      # `se flow` tests pass.
      - name: Install smithers dependencies in the source tree
        working-directory: home/private_dot_claude/dot_smithers
        run: bun install --frozen-lockfile --backend=copyfile

      # Report the gap once, here, instead of once per dependent test.
      - name: Verify the smithers binary the tests call
        run: test -x home/private_dot_claude/dot_smithers/node_modules/.bin/smithers

      # Stage 5: Post-apply tests
      - name: Run post-apply tests
        run: bats tests/smoke.bats tests/scripts.bats tests/palette.bats tests/platform.bats tests/idempotent.bats

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Install bats
        run: brew install bats-core

      # See the ubuntu job: fzf is the command palette's scorer, not optional.
      - name: Install fzf
        run: brew install fzf

      - name: Initialize chezmoi
        run: chezmoi init --source=./home

      - name: Validate test infrastructure
        run: bats tests/helpers_test.bats

      - name: Run template tests (pre-apply gate)
        run: bats tests/templates.bats

      - name: Apply dotfiles (dry-run first)
        run: chezmoi diff --source=./home || true

      - name: Apply dotfiles
        run: chezmoi apply --source=./home --verbose

      # See the ubuntu job: the checkout-based `se` tests read their smithers
      # directory from the source tree, which the apply does not provision.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install smithers dependencies in the source tree
        working-directory: home/private_dot_claude/dot_smithers
        run: bun install --frozen-lockfile

      - name: Verify the smithers binary the tests call
        run: test -x home/private_dot_claude/dot_smithers/node_modules/.bin/smithers

      - name: Run post-apply tests
        run: bats tests/smoke.bats tests/scripts.bats tests/palette.bats tests/platform.bats tests/idempotent.bats

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: make lint
