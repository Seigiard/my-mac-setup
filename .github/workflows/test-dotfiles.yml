name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The nightly full-Brewfile install. Push and PR runs install only what the
  # tests resolve from brew, so this is the only thing that catches an upstream
  # formula or cask that stops installing on its own — decay no diff announces.
  #
  # Its guarantee lapses silently: GitHub disables `schedule` triggers after 60
  # days of repository inactivity, and a workflow that never runs produces no
  # failure and therefore no notification. `workflow_dispatch` is the manual
  # recovery, and also the way to verify the full-set path on demand.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# A newer commit on the same ref makes the running check obsolete, so cancel it
# and free the macOS runner slot for the verdict someone will actually read.
# `main` is included deliberately: it carries no branch protection, so a
# cancelled run blocks no required check. The group carries `event_name`
# because a scheduled run executes on `refs/heads/main` too — without it, a
# morning push would silently cancel the nightly run, which sends no failure
# notification when cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHEZMOI_NAME: "Test User"
  CHEZMOI_EMAIL: "test@example.com"
  # Selects the CI-minimal Brewfile render. `push` and `pull_request` are
  # enumerated positively so that any trigger added later defaults to the full,
  # safe set rather than silently to the minimal one. A Brewfile-touching diff
  # clears this again per-job, below.
  MMS_CI_MINIMAL: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '1' || '' }}
  # Runners lack node's release GPG key, so mise's signature check on
  # `node@lts` fails. Skip it in CI; local installs keep verification.
  MISE_NODE_VERIFY: "false"
  # `brew cleanup` runs after every formula and deletes stale downloads from a
  # cache that parallel installs are still writing. When it loses that race it
  # exits non-zero, which `brew bundle` counts as a failed dependency and the
  # whole apply fails on a formula that actually installed. The Docker runner
  # already disables it (docker/Dockerfile.ubuntu); the workflow now matches.
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    # A normal run takes ~5 min; a hung apt mirror otherwise holds the job
    # for the 360-min default and burns Actions minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The Brewfile-diff step below needs the event's base commit present.
          # 691 commits, so this costs a second or two against the minutes the
          # minimal install saves.
          fetch-depth: 0

      # A commit that edits a Brewfile is the commit that should prove it
      # installs, so a diff touching these paths restores the full render
      # instead of waiting for the nightly run. About 4% of commits touch them,
      # so this costs the full install on roughly one commit in 25.
      #
      # It fails open: every state where the diff cannot be computed — a new
      # branch, a force push, a base commit missing from the checkout — installs
      # everything. A needless full install costs a few minutes; a wrong minimal
      # install silently drops the only pre-merge proof a Brewfile edit gets.
      - name: Install the full Brewfiles when the diff touches one
        env:
          # SHAs from the event payload, read through the environment rather
          # than interpolated into the script.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          install_full() {
            echo "MMS_CI_MINIMAL=" >> "$GITHUB_ENV"
            echo "full Brewfile install: $1"
          }

          case "$GITHUB_EVENT_NAME" in
            push|pull_request) ;;
            *) echo "event $GITHUB_EVENT_NAME already selects the full set"; exit 0 ;;
          esac

          empty_sha="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$empty_sha" ]; then
            install_full "no base commit for this event"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            install_full "base commit $BASE_SHA is not in this checkout"
            exit 0
          fi

          if ! changed=$(git diff --name-only "${BASE_SHA}...HEAD"); then
            install_full "could not diff against $BASE_SHA"
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -q '^home/private_dot_config/brewfiles/'; then
            install_full "the diff touches home/private_dot_config/brewfiles/"
          else
            echo "no Brewfile change; the minimal install stands"
          fi

      # azure.archive.ubuntu.com outages hang apt for the whole job timeout:
      # apt retries the dead mirror for every index file instead of failing
      # over. The swap is unconditional — a health check would pass a half-dead
      # mirror, and this job installs too little for mirror speed to matter.
      - name: Drop the azure apt mirror
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin

      - name: Add chezmoi to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # The command palette shells out to `fzf --filter` and refuses to start
      # without it. Ubuntu's apt fzf predates --accept-nth, which the palette
      # uses to map a match back to its command, so install the upstream build.
      - name: Install fzf
        run: |
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin fzf
          fzf --version
        env:
          FZF_VERSION: "0.74.3"

      # Must precede the apply: run_onchange_after_4-install-smithers-deps.sh
      # provisions ~/.claude/.smithers only when bun is on PATH, and exits 0
      # without a word when it is not. The Brewfile does install bun, but into
      # Linuxbrew's prefix, which this job never puts on PATH — so the apply
      # silently leaves the runtime without node_modules and the `se flow`
      # tests then run bun in a directory that has none. macOS never hits this
      # because brew's prefix is on PATH there by default.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # Stage 1: Initialize chezmoi (non-interactive via env vars)
      - name: Initialize chezmoi
        run: chezmoi init --source=./home

      # Stage 2: Fast pre-check gate (no apply needed)
      - name: Run template tests (pre-apply gate)
        run: bats tests/templates.bats

      # Stage 4: Apply dotfiles
      - name: Apply dotfiles (dry-run first)
        run: chezmoi diff --source=./home || true

      - name: Apply dotfiles
        run: chezmoi apply --source=./home --verbose

      # The other smithers directory. Tests that set SE_SMITHERS_DIR point `se`
      # at the checkout instead of the deployed runtime, and nothing provisions
      # that copy — the apply deploys from it, it does not build it.
      - name: Install smithers dependencies in the source tree
        working-directory: home/private_dot_claude/dot_smithers
        run: bun install --frozen-lockfile

      # Report each gap once, here, instead of once per dependent test.
      - name: Verify both smithers directories the tests call
        run: |
          test -x home/private_dot_claude/dot_smithers/node_modules/.bin/smithers
          test -x "$HOME/.claude/.smithers/node_modules/.bin/smithers"

      # Within-file parallelism runs on bats' own semaphore, which hard-exits
      # with "flock/shlock is required for parallelization within files!" when
      # neither is present. Nothing is installed here: flock ships in Ubuntu,
      # macOS ships /usr/bin/shlock. Asserting it gives that failure its own
      # step instead of letting it surface mid-suite. --jobs needs bats >= 1.5;
      # the version check guards against a runner-image pin-back.
      - name: Assert the parallel-run prerequisites
        run: |
          command -v flock || command -v shlock
          bats --version
          bats --version | awk '{print $2}' \
            | awk -F. '{ exit !($1 > 1 || ($1 == 1 && $2 >= 5)) }'

      # Stage 5: Post-apply tests
      - name: Run post-apply tests
        run: bats --jobs 8 --no-parallelize-across-files tests/smoke.bats tests/scripts.bats tests/palette.bats tests/platform.bats tests/idempotent.bats

  test-macos:
    runs-on: macos-latest
    # A normal run takes ~10 min; brew install times vary, so keep headroom.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The Brewfile-diff step below needs the event's base commit present.
          # 691 commits, so this costs a second or two against the minutes the
          # minimal install saves.
          fetch-depth: 0

      # A commit that edits a Brewfile is the commit that should prove it
      # installs, so a diff touching these paths restores the full render
      # instead of waiting for the nightly run. About 4% of commits touch them,
      # so this costs the full install on roughly one commit in 25.
      #
      # It fails open: every state where the diff cannot be computed — a new
      # branch, a force push, a base commit missing from the checkout — installs
      # everything. A needless full install costs a few minutes; a wrong minimal
      # install silently drops the only pre-merge proof a Brewfile edit gets.
      - name: Install the full Brewfiles when the diff touches one
        env:
          # SHAs from the event payload, read through the environment rather
          # than interpolated into the script.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          install_full() {
            echo "MMS_CI_MINIMAL=" >> "$GITHUB_ENV"
            echo "full Brewfile install: $1"
          }

          case "$GITHUB_EVENT_NAME" in
            push|pull_request) ;;
            *) echo "event $GITHUB_EVENT_NAME already selects the full set"; exit 0 ;;
          esac

          empty_sha="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$empty_sha" ]; then
            install_full "no base commit for this event"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            install_full "base commit $BASE_SHA is not in this checkout"
            exit 0
          fi

          if ! changed=$(git diff --name-only "${BASE_SHA}...HEAD"); then
            install_full "could not diff against $BASE_SHA"
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -q '^home/private_dot_config/brewfiles/'; then
            install_full "the diff touches home/private_dot_config/brewfiles/"
          else
            echo "no Brewfile change; the minimal install stands"
          fi

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Install bats
        run: brew install bats-core

      # See the ubuntu job: fzf is the command palette's scorer, not optional.
      - name: Install fzf
        run: brew install fzf

      - name: Initialize chezmoi
        run: chezmoi init --source=./home

      - name: Run template tests (pre-apply gate)
        run: bats tests/templates.bats

      - name: Apply dotfiles (dry-run first)
        run: chezmoi diff --source=./home || true

      - name: Apply dotfiles
        run: chezmoi apply --source=./home --verbose

      # See the ubuntu job. The deployed runtime needs no step here: brew's
      # prefix is on PATH, so the apply's own script already provisioned it.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install smithers dependencies in the source tree
        working-directory: home/private_dot_claude/dot_smithers
        run: bun install --frozen-lockfile

      - name: Verify both smithers directories the tests call
        run: |
          test -x home/private_dot_claude/dot_smithers/node_modules/.bin/smithers
          test -x "$HOME/.claude/.smithers/node_modules/.bin/smithers"

      # Within-file parallelism runs on bats' own semaphore, which hard-exits
      # with "flock/shlock is required for parallelization within files!" when
      # neither is present. Nothing is installed here: flock ships in Ubuntu,
      # macOS ships /usr/bin/shlock. Asserting it gives that failure its own
      # step instead of letting it surface mid-suite. --jobs needs bats >= 1.5;
      # the version check guards against a runner-image pin-back.
      - name: Assert the parallel-run prerequisites
        run: |
          command -v flock || command -v shlock
          bats --version
          bats --version | awk '{print $2}' \
            | awk -F. '{ exit !($1 > 1 || ($1 == 1 && $2 >= 5)) }'

      - name: Run post-apply tests
        run: bats --jobs 8 --no-parallelize-across-files tests/smoke.bats tests/scripts.bats tests/palette.bats tests/platform.bats tests/idempotent.bats

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the ubuntu job: the azure mirror hangs apt when it degrades.
      - name: Drop the azure apt mirror
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: make lint
