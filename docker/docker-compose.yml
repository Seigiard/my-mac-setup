services:
  # Interactive shell for debugging
  ubuntu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ubuntu
    volumes:
      - ../home:/home/testuser/dotfiles:ro
      - ../tests:/home/testuser/tests:ro
      - ../README.md:/home/testuser/README.md:ro
    environment:
      - CHEZMOI_NAME=Test User
      - CHEZMOI_EMAIL=test@example.com
      - HOMEBREW_NO_AUTO_UPDATE=1
      - HOMEBREW_NO_INSTALL_CLEANUP=1
      # The only entry here read from the host rather than written literally.
      # Empty by default, which selects the full Brewfile render, so R5 holds
      # unless the caller opts in.
      - MMS_CI_MINIMAL=${MMS_CI_MINIMAL:-}
      # Declares this container's $HOME disposable, which is what lets the
      # idempotency scenario in tests/idempotent.bats run its real `chezmoi
      # apply`. Written literally in all three services, unlike
      # MMS_CI_MINIMAL above, which is read from the host and is deliberately
      # absent from the test-ubuntu service. tests/idempotent.bats hard-fails when
      # /.dockerenv exists and this is missing.
      - MMS_DISPOSABLE_HOME=1
    tty: true

  # Full test with package installation
  test-full:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ubuntu
    volumes:
      - ../home:/home/testuser/dotfiles:ro
      - ../tests:/home/testuser/tests:ro
      - ../scripts/issues:/home/testuser/issues-cli:ro
      - ../docs/issues:/home/testuser/issues:ro
      - ../Makefile:/home/testuser/Makefile:ro
      - ../README.md:/home/testuser/README.md:ro
    environment:
      - CHEZMOI_NAME=Test User
      - CHEZMOI_EMAIL=test@example.com
      - HOMEBREW_NO_AUTO_UPDATE=1
      - HOMEBREW_NO_INSTALL_CLEANUP=1
      # Selects the CI-minimal Brewfile render, bound by the `chezmoi init`
      # below. Empty by default so `make test-docker` keeps installing the full
      # cross-platform Brewfile (R5). Set it to compare skip counts between the
      # two renders:
      #   MMS_CI_MINIMAL=1 docker compose -f docker/docker-compose.yml run --rm test-full
      # The `test-ubuntu` service deliberately has no such entry, which keeps
      # `make test-ubuntu` on the full render — see docs/issues/2026-08-20-014.
      - MMS_CI_MINIMAL=${MMS_CI_MINIMAL:-}
      # See the ubuntu service above for why this is written literally.
      - MMS_DISPOSABLE_HOME=1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "=== Staging writable test worktree ==="
        mkdir -p /home/testuser/worktree/.git /home/testuser/worktree/docs /home/testuser/worktree/scripts
        cp -r /home/testuser/dotfiles /home/testuser/worktree/home
        cp -r /home/testuser/tests /home/testuser/worktree/tests
        cp /home/testuser/issues-cli /home/testuser/worktree/scripts/issues
        cp -r /home/testuser/issues /home/testuser/worktree/docs/issues
        cp /home/testuser/Makefile /home/testuser/worktree/Makefile
        cp /home/testuser/README.md /home/testuser/worktree/README.md
        rm -rf /home/testuser/worktree/home/private_dot_claude/dot_smithers/node_modules
        cd /home/testuser/worktree

        echo "=== Copying dotfiles to chezmoi source ==="
        (cd home && cp -r . /home/testuser/.local/share/chezmoi/)

        echo "=== Initializing chezmoi ==="
        chezmoi init --source=/home/testuser/.local/share/chezmoi \
          --promptString name="Test User" \
          --promptString email="test@example.com"

        echo "=== Running template tests (pre-apply gate) ==="
        tests/lib/bashunit -j 8 tests/bashunit/templates_test.sh

        echo "=== Applying dotfiles (with package installation) ==="
        chezmoi apply --source=/home/testuser/.local/share/chezmoi --verbose

        echo "=== Running Smithers test gate ==="
        make test-smithers

        echo "=== Running post-apply tests ==="
        tests/run-post-apply.sh full

        echo "=== All done! ==="

  # Full Ubuntu test without the optional CI-minimal Brewfile render
  test-ubuntu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ubuntu
    volumes:
      - ../home:/home/testuser/dotfiles:ro
      - ../tests:/home/testuser/tests:ro
      - ../scripts/issues:/home/testuser/issues-cli:ro
      - ../docs/issues:/home/testuser/issues:ro
      - ../Makefile:/home/testuser/Makefile:ro
      - ../README.md:/home/testuser/README.md:ro
    environment:
      - CHEZMOI_NAME=Test User
      - CHEZMOI_EMAIL=test@example.com
      - HOMEBREW_NO_AUTO_UPDATE=1
      - HOMEBREW_NO_INSTALL_CLEANUP=1
      # See the ubuntu service above for why this is written literally. Note
      # that MMS_CI_MINIMAL stays absent here on purpose (docs/issues/
      # 2026-08-20-014); only the disposable-$HOME marker is shared.
      - MMS_DISPOSABLE_HOME=1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mkdir -p /home/testuser/worktree/.git /home/testuser/worktree/docs /home/testuser/worktree/scripts
        cp -r /home/testuser/dotfiles /home/testuser/worktree/home
        cp -r /home/testuser/tests /home/testuser/worktree/tests
        cp /home/testuser/issues-cli /home/testuser/worktree/scripts/issues
        cp -r /home/testuser/issues /home/testuser/worktree/docs/issues
        cp /home/testuser/Makefile /home/testuser/worktree/Makefile
        cp /home/testuser/README.md /home/testuser/worktree/README.md
        rm -rf /home/testuser/worktree/home/private_dot_claude/dot_smithers/node_modules
        cd /home/testuser/worktree
        (cd home && cp -r . /home/testuser/.local/share/chezmoi/)
        chezmoi init --source=/home/testuser/.local/share/chezmoi \
          --promptString name="Test User" \
          --promptString email="test@example.com"
        tests/lib/bashunit -j 8 tests/bashunit/templates_test.sh
        chezmoi apply --source=/home/testuser/.local/share/chezmoi --verbose
        make test-smithers
        tests/run-post-apply.sh full
